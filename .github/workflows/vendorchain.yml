name: VendorChain Security Pipeline

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  security-pipeline:
    name: SBOM Generation and Signing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        run: |
          mkdir -p outputs
          syft scan . -o cyclonedx-json=outputs/sbom.json
          echo "SBOM generated successfully"
          cat outputs/sbom.json | python3 -c "import json,sys; data=json.load(sys.stdin); print(f'Components found: {len(data[\"components\"])}')"

      - name: Compute SBOM hash
        run: |
          SBOM_HASH=$(sha256sum outputs/sbom.json | cut -d' ' -f1)
          echo "SBOM_HASH=$SBOM_HASH" >> $GITHUB_ENV
          echo "SBOM SHA256: $SBOM_HASH"

      - name: Install cosign
        run: |
          curl -O -L "https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64"
          sudo mv cosign-linux-amd64 /usr/local/bin/cosign
          sudo chmod +x /usr/local/bin/cosign
          cosign version

      - name: Write cosign keys from secrets
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" | base64 -d > /tmp/cosign.key
          echo "${{ secrets.COSIGN_PUBLIC_KEY }}" > /tmp/cosign.pub

      - name: Sign SBOM
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign sign-blob \
            --key /tmp/cosign.key \
            --bundle outputs/sbom.json.bundle \
            --new-bundle-format \
            outputs/sbom.json
          echo "SBOM signed successfully"

      - name: Verify SBOM signature
        run: |
          cosign verify-blob \
            --key /tmp/cosign.pub \
            --bundle outputs/sbom.json.bundle \
            outputs/sbom.json
          echo "Signature verified — SBOM is genuine and untampered"

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          sudo mv opa /usr/local/bin/opa
          sudo chmod +x /usr/local/bin/opa
          opa version

      - name: Build OPA input from SBOM
        run: |
          python3 - << 'PYEOF'
          import json
          from datetime import datetime

          with open("outputs/sbom.json", "r") as f:
              sbom_data = json.load(f)

          opa_input = {
              "vendor_id": "pipeline-test",
              "vendor_certificate_status": "approved",
              "signature_verified": True,
              "sbom_hash": "${{ env.SBOM_HASH }}",
              "timestamp": datetime.utcnow().isoformat() + "Z",
              "sbom": sbom_data
          }

          with open("outputs/opa_input.json", "w") as f:
              json.dump(opa_input, f, indent=2)

          print("OPA input file created")
          PYEOF

      - name: Run OPA policy evaluation
        id: opa
        run: |
          # 1. Run OPA evaluation with raw format
          RESULT=$(opa eval \
            --input outputs/opa_input.json \
            --data policies/vendorchain.rego \
            "data.vendorchain.summary" \
            --format raw)

          # 2. Safely parse values (supports raw JSON output without crashing)
          ALLOW=$(echo "$RESULT" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('allow', False))")
          RISK=$(echo "$RESULT" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('risk_level', 'unknown'))")
          COUNT=$(echo "$RESULT" | python3 -c "import json,sys; data=json.load(sys.stdin); print(data.get('component_count', 0))")
          REASONS=$(echo "$RESULT" | python3 -c "import json,sys; data=json.load(sys.stdin); reasons=data.get('denial_reasons',[]); print(', '.join(reasons))")

          # 3. Export to GitHub Actions outputs/environment
          echo "OPA_ALLOW=$ALLOW" >> $GITHUB_ENV
          echo "OPA_RISK=$RISK" >> $GITHUB_ENV
          echo "OPA_COUNT=$COUNT" >> $GITHUB_ENV

          echo "================================================"
          echo "   VendorChain OPA Policy Result"
          echo "================================================"
          echo "Components   : $COUNT"
          echo "Risk Level   : $RISK"
          echo "Allow        : $ALLOW"

          if [ "$ALLOW" = "True" ] || [ "$ALLOW" = "true" ]; then
            echo "VERDICT      : ✓ PASS"
          else
            echo "VERDICT      : ✗ FAIL"
            echo "Denial Reasons: $REASONS"
            exit 1
          fi

          echo "OPA policy passed - proceeding to blockchain recording"

      - name: Save pipeline result to Supabase
        if: always()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "${{ env.OPA_ALLOW }}" = "True" ]; then
            RESULT="PASS"
          else
            RESULT="FAIL"
          fi

          curl -s -X POST "$SUPABASE_URL/rest/v1/pipeline_runs" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{
              \"commit_sha\": \"${{ github.sha }}\",
              \"branch\": \"${{ github.ref_name }}\",
              \"sbom_hash\": \"${{ env.SBOM_HASH }}\",
              \"opa_result\": \"$RESULT\",
              \"risk_level\": \"${{ env.OPA_RISK }}\",
              \"status\": \"pipeline_complete\"
            }"

          echo "Pipeline result saved to Supabase — OPA result: $RESULT"

      - name: Clean up keys from runner
        run: |
          rm -f /tmp/cosign.key /tmp/cosign.pub
          echo "Keys removed from runner"

      - name: Upload SBOM and bundle as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vendorchain-sbom-${{ github.sha }}
          path: |
            outputs/sbom.json
            outputs/sbom.json.bundle
            outputs/opa_input.json
          retention-days: 30

      - name: Print pipeline summary
        run: |
          echo "================================================"
          echo "   VendorChain Pipeline Summary"
          echo "================================================"
          echo "Branch    : ${{ github.ref_name }}"
          echo "Commit    : ${{ github.sha }}"
          echo "SBOM Hash : ${{ env.SBOM_HASH }}"
          echo "OPA Verdict : ${{ env.OPA_ALLOW }}"
          echo "Risk Level  : ${{ env.OPA_RISK }}"
          echo "Status    : PASSED"
          echo "================================================"